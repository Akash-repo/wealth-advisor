<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Wealth Advisor</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; }
		header { display: flex; justify-content: space-between; align-items: center; }
		#log { border: 1px solid #ccc; border-radius: 0.5rem; padding: 1rem; height: 24rem; overflow-y: auto; margin: 1rem 0; }
		.msg { margin-bottom: 0.75rem; white-space: pre-wrap; }
		.msg.user { text-align: right; color: #1a4; }
		.msg.agent { text-align: left; color: #333; }
		form { display: flex; gap: 0.5rem; }
		input[type=text] { flex: 1; padding: 0.5rem; font-size: 1rem; }
		button { padding: 0.5rem 1rem; }
	</style>
</head>
<body>
<header>
	<h2>Wealth Advisor</h2>
	<form method="post" action="/api/auth/logout"><button type="submit">Log out</button></form>
</header>

<div id="log"></div>

<form id="chat-form">
	<input id="message" type="text" placeholder="Ask about a stock or your portfolio..." autocomplete="off" required>
	<button type="submit">Send</button>
</form>

<script>
	const log = document.getElementById('log');
	const form = document.getElementById('chat-form');
	const messageInput = document.getElementById('message');

	function appendMessage(text, who) {
		const div = document.createElement('div');
		div.className = 'msg ' + who;
		div.textContent = text;
		log.appendChild(div);
		log.scrollTop = log.scrollHeight;
	}

	form.addEventListener('submit', async (event) => {
		event.preventDefault();
		const message = messageInput.value.trim();
		if (!message) return;
		appendMessage(message, 'user');
		messageInput.value = '';

		const response = await fetch('/api/chat', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ message }),
		});
		if (!response.ok) {
			appendMessage('Error: ' + response.status, 'agent');
			return;
		}
		const data = await response.json();
		appendMessage(data.reply, 'agent');
	});
</script>
</body>
</html>
