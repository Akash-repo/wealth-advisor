<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wealth Advisor</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-3">
	<div class="container" style="max-width: 40rem;">
		<span class="navbar-brand mb-0 h1 d-flex align-items-center"><span class="brand-mark">WA</span>Wealth Advisor</span>
		<form method="post" action="/api/auth/logout">
			<button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
		</form>
	</div>
</nav>

<div class="container pb-4" style="max-width: 40rem;">

	<div class="card mb-3">
		<div class="card-body">
			<h6 class="card-subtitle mb-2 text-muted">Upload portfolio statements</h6>
			<form id="upload-form" class="row g-2 align-items-center">
				<div class="col-12 col-sm">
					<input id="portfolio-file" type="file" class="form-control form-control-sm" accept="application/pdf" multiple required>
				</div>
				<div class="col-auto">
					<button type="submit" class="btn btn-sm btn-primary">Upload</button>
				</div>
			</form>
			<div class="form-text mt-1">PDF brokerage or portfolio statements only. Add one per account.</div>
			<div id="upload-status" class="form-text mt-1"></div>
		</div>
	</div>

	<div class="card mb-3">
		<div class="card-body">
			<h6 class="card-subtitle mb-2 text-muted">Your statements</h6>
		</div>
		<ul id="documents-list" class="list-group list-group-flush"></ul>
	</div>

	<div class="input-group input-group-sm mb-2">
		<label class="input-group-text" for="session-select">Conversation</label>
		<select id="session-select" class="form-select"></select>
		<button id="new-session" type="button" class="btn btn-outline-primary">New chat</button>
		<button id="delete-session" type="button" class="btn btn-outline-danger">Delete</button>
	</div>

	<div id="chat-log" class="border rounded-3 p-3 mb-3 bg-white" style="height: 24rem; overflow-y: auto;"></div>

	<form id="chat-form" class="input-group mb-4">
		<input id="message" type="text" class="form-control" placeholder="Ask about a stock or your portfolio..." autocomplete="off" required>
		<button type="submit" class="btn btn-primary">Send</button>
	</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/chat.js"></script>
</body>
</html>
