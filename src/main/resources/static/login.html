<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Wealth Advisor - Login</title>
	<style>
		body { font-family: system-ui, sans-serif; display: flex; justify-content: center; margin-top: 10vh; }
		form { display: flex; flex-direction: column; gap: 0.75rem; width: 20rem; }
		input, button { padding: 0.5rem; font-size: 1rem; }
		h1 { text-align: center; }
		a { text-align: center; font-size: 0.9rem; }
	</style>
</head>
<body>
<form method="post" action="/api/auth/login">
	<h1>Wealth Advisor</h1>
	<input type="text" name="username" placeholder="Username" autofocus required>
	<input type="password" name="password" placeholder="Password" required>
	<button type="submit">Log in</button>
	<a href="/signup.html">Need an account? Sign up</a>
</form>
</body>
</html>
