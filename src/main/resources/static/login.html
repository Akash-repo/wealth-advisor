<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Wealth Advisor - Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center min-vh-100">
	<div class="card shadow-sm auth-card" style="width: 22rem;">
		<div class="card-body">
			<div class="text-center mb-3">
				<span class="brand-mark border">WA</span>
			</div>
			<h4 class="card-title text-center mb-3">Wealth Advisor</h4>
			<form method="post" action="/api/auth/login">
				<div class="mb-3">
					<input type="text" name="username" class="form-control" placeholder="Username" autofocus required>
				</div>
				<div class="mb-3">
					<input type="password" name="password" class="form-control" placeholder="Password" required>
				</div>
				<button type="submit" class="btn btn-primary w-100">Log in</button>
			</form>
			<div class="text-center mt-3">
				<a href="/signup.html" class="small">Need an account? Sign up</a>
			</div>
		</div>
	</div>
</div>
</body>
</html>
