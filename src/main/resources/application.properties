spring.application.name=advisor

# GCP project used for the Firestore client (see FirestoreConfig). Any placeholder value works
# when pointed at the Firestore emulator (FIRESTORE_EMULATOR_HOST) instead of real Firestore.
gcp.project-id=${GCP_PROJECT_ID:wealth-agent-local}

# Seeded by DemoUserSeeder on startup so there's a user to log in with. Override before using
# this beyond local dev.
wealth.demo-user.username=${DEMO_USER_USERNAME:demo}
wealth.demo-user.password=${DEMO_USER_PASSWORD:changeme}

# Mitigates CSRF for this same-origin app without needing CSRF tokens; see SecurityConfig.
server.servlet.session.cookie.same-site=lax
